[project]
name = "reversi-train"
version = "0.1.0"
description = "AlphaZero self-play training pipeline for Reversi"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    # Apple Silicon: MLX on Metal.
    "mlx>=0.32.4; sys_platform == 'darwin'",
    # Linux: PyTorch on CUDA. (MLX also runs there, but its CUDA inference is
    # roughly ten times slower than PyTorch's on this network.)
    "torch>=2.9; sys_platform == 'linux'",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = ["ruff>=0.15.7", "tensorboard>=2.20.0", "maturin>=1.8"]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.uv]
package = false

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "../rust/mcts/Cargo.toml"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["reversi_train"]
