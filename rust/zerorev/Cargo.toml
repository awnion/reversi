[package]
name = "reversi_zerorev"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Search on several threads sharing one tree. Needs a nightly build with
# atomics (see tools/build_wasm.sh) and a cross-origin isolated page.
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
js-sys = "0.3"
rayon = { version = "1.10", optional = true }
reversi_mcts = { path = "../mcts" }
reversi_minimax = { path = "../minimax" }
reversi_nn = { path = "../nn" }
wasm-bindgen = "=0.2.121"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[dev-dependencies]
reversi_nn = { path = "../nn", features = ["test-utils"] }
