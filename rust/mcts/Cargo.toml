[package]
name = "reversi_mcts"
version = "0.1.0"
edition.workspace = true

[lib]
name = "reversi_mcts"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:reversi_nn", "pyo3/extension-module"]

[dependencies]
reversi_minimax = { path = "../minimax" }
reversi_nn = { path = "../nn", optional = true }

[dependencies.pyo3]
features = ["abi3-py312"]
optional = true
version = "0.23"
